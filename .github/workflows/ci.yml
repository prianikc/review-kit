name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Тесты
        run: node --test 'mod/**/*.test.ts' '.github/scripts/*.test.mjs'
      - name: Валидация плагина
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Версию не трогали руками
        if: github.event_name == 'pull_request'
        run: node .github/scripts/no-manual-version.mjs "origin/${{ github.base_ref }}"
